name: Coleta

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Coletar
        env:
          APP_URL: https://appplatcert.vercel.app
          PLATCERT_REPO: AppCertificado/platcert
          CONTRACT_VERSION: "1.0"
          GITHUB_TOKEN_PLATCERT: ${{ secrets.PLATCERT_READ_TOKEN }}
          SUPABASE_HTTP_URL: ${{ secrets.SUPABASE_HTTP_URL }}
          PREVIOUS_STATUS_URL: https://appcertificado.github.io/platcert-health/status.json
        run: node collector/collect.mjs docs/status.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
